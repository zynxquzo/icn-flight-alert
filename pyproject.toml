[project]
name = "icn-flight-alert"
version = "0.1.0"
description = "인천공항 비행편 모니터링·알림 API (FastAPI, PostgreSQL/asyncpg, 인천공항 OpenAPI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.15.0",
    "apscheduler>=3.11.2",
    "bcrypt>=5.0.0",
    "beautifulsoup4>=4.12.0",
    "fastapi[standard]>=0.135.1",
    "httpx>=0.27.0",
    "lxml>=5.0.0",
    "chromadb>=0.4.22",
    "openai>=2.29.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.11",
    "pyjwt>=2.12.1",
    "python-dotenv>=1.2.2",
    "redis>=5.2.0",
    "sentry-sdk[fastapi]>=2.20.0",
    "sqlalchemy>=2.0.48",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "respx>=0.22.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]
